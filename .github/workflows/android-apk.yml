name: APK Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer Capacitor
        run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          # Autorise http:// vers le Raspberry Pi du réseau local
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compiler l'APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-outils-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
